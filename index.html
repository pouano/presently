<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Presently — simple attendance tracker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Presently</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}.shell{max-width:720px;margin:auto;padding:24px 16px 48px}.brand{font-size:32px;font-weight:800;letter-spacing:-1px}.muted{color:#6b7280}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0000000d}.btn{border:0;border-radius:12px;padding:12px 16px;background:#111827;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:#b91c1c}.btn:disabled{opacity:.5}.stack{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e5e7eb;font-size:12px;font-weight:700}.success{color:#047857}.error{color:#b91c1c}.attendance{border:2px solid #10b981}.footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:36px}.hidden{display:none!important}.small{font-size:13px}.big{font-size:22px;font-weight:800}.center{text-align:center}.install-box{display:grid;gap:12px;justify-items:center;padding:10px 0}.install-note{max-width:420px;line-height:1.5}.login-box{display:grid;gap:14px;justify-items:center;text-align:center}
  </style>
</head>
<body>
<div class="shell">
  <div class="row">
    <div>
      <div class="brand">Presently</div>
      <div class="muted">Simple attendance tracker</div>
    </div>
    <button id="logout" class="btn secondary hidden">Sign out</button>
  </div>

  <div id="message" class="card hidden"></div>

  <section id="login" class="card">
    <div id="installPrompt" class="install-box hidden">
      <div class="big" id="installTitle">Install Presently</div>
      <p class="muted install-note" id="installText">Add Presently to your Home Screen to continue.</p>
      <button id="installBtn" class="btn">Install Presently</button>
    </div>

    <div id="signInPrompt" class="login-box hidden">
      <p class="muted">Sign in with your Google account to continue.</p>
      <div id="googleBtn"></div>
    </div>
  </section>

  <section id="app" class="hidden">
    <div id="userCard" class="card"></div>
    <div id="traineeView"></div>
    <div id="trainerView"></div>
  </section>

  <div class="footer">Copyright © Atty. Paul Ouano</div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
